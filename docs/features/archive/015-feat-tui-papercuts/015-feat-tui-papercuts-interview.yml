phase1_feature_overview:

  feature_description:
    score: 95
    status: "complete"
    value: |
      Батч мелких доработок интерактивного режима `pgcenter top`. Объединены в одну фичу, потому
      что каждый пункт — небольшой объём кода в пакете `top/`, и отдельные SDD-циклы стоили бы
      дороже самого кода. Общего между пунктами — только пакет; функции разные (keybindings,
      оконная логика колонок, cmdline, шапка sysstat, геометрия верхней полосы).

      Из роадмапа 0.12.0, раздел [015]:
      1. Пауза рендера по `Space` с индикацией `PAUSED` в cmdline.
      2. Автоскролл окна видимых колонок к колонке сортировки при смене `OrderKey`.
      3. Постоянный индикатор активного фильтра в cmdline.
      4. Текущий интервал обновления в первой строке шапки (часы там уже есть).

      Добавлено пользователем в ходе интервью (в роадмапе нет, роадмап обновляем при финализации):
      5. Убрать лишнюю пустую строку между cmdline и таблицей в verbose-режиме.
      6. Раскрасить bold'ом значения в verbose-секциях обеих панелей — в базовых строках это
         сделано, при добавлении verbose (фича 010) забыли.

      Вынужденно втянуто в скоуп решением по пункту 8 интервью:
      7. Починить геометрию диалогов, которая сегодня предполагает пустой cmdline — иначе
         постоянный префикс индикаторов сдвинет промпт относительно поля ввода.
    gaps: ""
    required: true

  user_problem:
    score: 85
    status: "partial"
    value: |
      Фрикции, замедляющие работу с TUI:
      - Нельзя остановить обновление, чтобы прочитать/скопировать строку — экран уезжает.
        Есть у любого top-подобного инструмента, в pgcenter биндинга Space нет вообще.
        ЧЕСТНАЯ ОГОВОРКА (замечание dev-customer, фиксируем осознанно): ценность паузы
        аргументирована ПО АНАЛОГИИ с другими top-подобными инструментами, а не по конкретной
        жалобе, issue или наблюдённому инциденту. В отличие от автоскролла (следствие
        зафиксированного ограничения фичи 009) и индикатора фильтра (реальный риск принять
        отфильтрованную выборку за полную). При этом пауза — самый дорогой пункт батча
        в реализации. Допущение принимается, но не прячется.
      - После фичи 009 (горизонтальный скролл) сортировка по колонке за пределами видимого окна
        не даёт видимого эффекта: данные пересортировались, но ни колонки, ни её подсветки не видно.
      - Активный фильтр обозначен только звёздочкой `*` на заголовке колонки, а заголовок после 009
        можно отскроллить за экран. Итог: читаешь отфильтрованные данные, считая их полной картиной.
        Единственный настоящий footgun в батче.
      - Значение интервала обновления, выставленное через `z`, нигде не отображается после установки —
        диалог пишет "Refresh: ok" и закрывается.
    gaps: ""
    required: true

  target_users:
    score: 80
    status: "partial"
    value: |
      Практикующий PostgreSQL DBA, работающий с pgcenter top в терминале, в том числе во время
      инцидента (аудиторная линза релиза 0.12.0).
    gaps: ""
    required: false

  success_criteria:
    score: 90
    status: "complete"
    value: |
      Приняты пользователем без изменений:
      1. `Space` ставит на паузу и снимает; на паузе экран не меняется, индикатор виден; после
         снятия первый же кадр свежий (не тот, что был на момент паузы), значения дельт нормальные
         для одного интервала, без всплеска.
      2. Сортировка стрелками по любой колонке, включая последнюю, всегда приводит колонку в видимую
         область; ручной скролл `[`/`]` после этого работает свободно и не откатывается на следующем тике.
      3. При активном фильтре индикатор виден на любом экране и при любом положении горизонтального
         скролла; при сбросе фильтра исчезает.
      4. Интервал обновления виден в шапке и меняется сразу после `z`.
    gaps: ""
    required: true

  constraints:
    score: 90
    status: "complete"
    value: |
      Подтверждено code research (`015-feat-tui-papercuts-code-research.md`):
      - `statCh` небуферизованный (`top/ui.go:73`) — простой пропуск рендера заблокирует коллектор
        на send и после resume отрисует устаревший кадр. Пауза должна дренировать канал, оставаясь
        в ветке `case s := <-statCh:`.
      - `viewCh` тоже небуферизованный: каждый обработчик клавиши блокирует горутину gocui до
        приёма коллектором. Второй независимый аргумент за "гейтим только рендер".
      - `app.uiExit` (`ui.go:90`) должен оставаться достижимым на паузе, иначе `l`/`C`/`~`/`G`
        подвесят UI.
      - Флаг паузы пишется из горутины gocui, читается в `doWork` — НАСТОЯЩАЯ межгорутинная гонка,
        `make test` идёт с `-race`. Нужен `atomic.Bool`. Пункты 2-7 гонок не создают: и писатели,
        и читатели живут в горутине gocui.
      - `printCmdline` (`ui.go:207`) при каждом непустом сообщении заводит таймер на 2 секунды,
        по которому `v.Clear()` стирает строку. Персистентной зоны статуса не существует —
        постоянные индикаторы требуют единой точки композиции строки cmdline.
      - `config.view.Refresh` — транзитный курьер, обнуляется сразу после отправки (`ui.go:86`,
        `config_view.go:456`). Обнуление трогать НЕЛЬЗЯ: порядок веток в `collectStat`
        (`stat.go:86-96`) на нём завязан, непустой Refresh делает `continue` до веток
        ShowExtra/Verbose. Нужно новое поле `config.refresh`, инициализируемое в `app.setup()`
        (не в `ui.go:82` — это горутина doWork).
      - `Space` свободен, но биндить надо `gocui.KeySpace` (termbox отдаёт пробел как Key=0x20,
        Ch=0, руна `' '` не совпадёт) и только на вьюху `"sysstat"`: `execKeybindings` выполняет
        ВСЕ совпадения, а глобальный биндинг сломает ввод пробела в диалоги фильтра.
      - `view.ColsWidth` известны только после `alignViewToResult` внутри `printDbstat`, поэтому
        автоскролл не может считаться в обработчике клавиши — только на рендере.
      - Рендер уже тестируем без живого терминала (io.Writer + чистая `visibleColumns`), паттерн
        из 009 — новые изменения рендера его придерживаются.
      - Изменений в запросах и новых view нет — нулевое влияние на count-based тесты
        (`TestNew`, `Test_filterViews`), на record/report и на `profile`.
      - `switchViewToProcPidStat` обходит `viewSwitchHandler` — любой новый per-view сброс надо
        дублировать там же и ДО гарда `db.Local` (прецедент ADR [009]).
    gaps: ""
    required: true

  testing_strategy:
    score: 90
    status: "complete"
    value: |
      - Unit-тесты обязательны для чистой логики: функция сдвига окна к колонке сортировки
        (в стиле `visibleColumns` из 009, с property-тестом), рендер шапки с интервалом через
        `bytes.Buffer`, сборка строки индикаторов cmdline.
      - Логика паузы тестируется на уровне дренажа канала без gocui: горутина-имитатор шлёт кадры
        в небуферизованный канал, проверяем, что она не блокируется и что после resume рендерится
        последний кадр, а не первый.
      - Интеграционные тесты с живым PG не нужны — запросы не меняются.
      - Ручная проверка обязательна для всех четырёх пунктов (`make build` в начале сессии,
        patterns.md: иначе бинарник устаревший).
      - ДОБАВЛЕНО пользователем: тестовые прогоны агентом на выделенном стенде — отдельным шагом
        после реализации, но до финализации фичи.
      Стенд: выделенная ВМ с доступом по ssh, регламент перенесён из соседнего книжного проекта
      и зафиксирован в `.claude/skills/project-knowledge/patterns.md`, раздел
      "Driving the TUI on a remote test stand". Ключевое:
      - адрес и креды в репозитории не хранятся, спрашивать у автора;
      - свежесобранный бинарник заливается на стенд явно, системный pgcenter из master не годится;
      - tmux с фиксированной геометрией (`-x 190 -y 52`) даёт воспроизводимость; узкие размеры
        (`-x 60`) — единственный вменяемый способ прогнать автоскролл и height-guard verbose;
      - `capture-pane -p` для текста, `capture-pane -p -e` для проверки ANSI — bold в verbose
        (пункт 6) проверяется ТОЛЬКО через `-e`, иначе отсутствие `\033[37;1m` неотличимо от наличия.
      - `-race` отдельно гонять не нужно: `make test` и так с race-детектором, а пункт 1 —
        единственный межгорутинный.
    gaps: ""
    required: true

# ============================================================================
# Phase 2: User Experience & Scenarios
# ============================================================================
phase2_user_experience:

  user_stories:
    score: 90
    status: "complete"
    value: |
      1. Как DBA, я хочу приостановить обновление экрана, чтобы успеть прочитать и скопировать
         строку, пока она не уехала при следующем обновлении.
         Сценарий: вижу подозрительный бэкенд → жму `Space` → в cmdline появляется `[PAUSED]`,
         экран замирает целиком → читаю/копирую → жму `Space` → индикатор гаснет, следующий кадр
         свежий, дельты нормальные для одного интервала.
      2. Как DBA, я хочу, чтобы колонка, по которой я сортирую, всегда была видна, иначе
         непонятно, что именно дало текущий порядок строк.
         Сценарий: на узком терминале жму `→` несколько раз → окно колонок само подтягивается так,
         что выбранная колонка попадает на экран, её подсветка видна → дальше могу свободно
         скроллить `[`/`]`, окно остаётся там, куда я его увёл.
      3. Как DBA, я хочу видеть, что на экране активен фильтр, чтобы не принять отфильтрованную
         выборку за полную картину.
         Сценарий: ставлю фильтр через `/` → в cmdline появляется `[F:datname]` → ухожу на другой
         экран и возвращаюсь → индикатор на месте (фильтры хранятся per-view) → сбрасываю фильтр →
         индикатор исчезает.
      4. Как DBA, я хочу видеть текущий интервал обновления, чтобы соотносить показания с логом
         Postgres и помнить, что я выставил через `z`.
         Сценарий: жму `z`, ввожу 5 → в первой строке шапки `pgcenter: <дата время>, refresh: 5s,
         load average: ...`.
      5. Как DBA, я хочу одним действием сбросить все фильтры, чтобы вернуться к полной картине,
         не выискивая колонки, на которых они были поставлены.
         Сценарий: индикатор показывает `[F:datname,usename]` → одно нажатие → все фильтры сняты,
         индикатор погас, строки вернулись.
      6. Как DBA, я хочу, чтобы verbose-режим не тратил строку экрана впустую и читался так же,
         как обычный режим.
         Сценарий: жму `v` → панели расширяются, между cmdline и таблицей нет пустой строки,
         значения в новых секциях выделены так же, как в базовых.
    gaps: ""
    required: true

  acceptance_criteria:
    score: 90
    status: "complete"
    value: |
      Пауза:
      - `Space` на любом стат-экране ставит паузу и снимает её; в cmdline виден `[PAUSED]`.
      - На паузе экран не меняется целиком: обе панели, таблица и боковые панели (включая logtail).
      - Коллектор во время паузы не блокируется (кадры дренируются и отбрасываются).
      - Первый кадр после снятия — свежий, дельты нормальные для одного интервала, без всплеска.
      - Кадр с ошибкой (`stat.Stat.Error`) пробивает паузу: рисуется и снимает её.
      - Переключение экрана снимает паузу; возврат из pager/editor (`l`, `C`, `~`, `G`) её сохраняет.
      - Сортировка, скролл и фильтр на паузе работают и перерисовывают из замороженного кадра.
      - `Space` не ломает ввод пробела в диалоги (биндинг на `"sysstat"`, не глобальный).
      Автоскролл:
      - Сортировка стрелками по любой колонке, включая последнюю, приводит колонку в видимую область.
      - Ручной `[`/`]` после этого работает свободно и не откатывается на следующем тике.
      - Окно не дёргается, когда колонка сортировки уже видна (движение минимальное).
      - Частично видимая колонка считается видимой (семантика окна из 009).
      Индикатор фильтра:
      - При активном фильтре виден на любом экране и при любом положении горизонтального скролла.
      - Несколько фильтров перечисляются именами колонок: `[F:datname,usename]`.
      - При сбросе исчезает; переживает уход на другой экран и возврат.
      - Порядок при обоих индикаторах — `[PAUSED][F:...]`.
      - Индикатор не стирается 2-секундным таймером cmdline.
      Сброс всех фильтров:
      - Одно действие снимает все фильтры текущего экрана, индикатор гаснет, строки возвращаются.
      - Сообщение о сбросе честное: не рапортует об успехе, когда снимать было нечего.
      Интервал обновления:
      - Виден в первой строке шапки, меняется сразу после `z`.
      - Число строк шапки не меняется (compact 4 / verbose 7).
      Verbose:
      - Между cmdline и таблицей нет пустой строки.
      - Значения verbose-секций обеих панелей выделены bold, сентинелы `n/a` — нет.
      - verbose включается на терминале от 12 строк.
      Диалоги:
      - Промпт и поле ввода выровнены при непустом cmdline (в том числе при активных индикаторах).
      Справка:
      - Экран справки (`top/help.go`) документирует `Space` (пауза) и `\` (сброс всех фильтров) —
        это единственное место, где пользователь узнаёт о новом хоткее, и своих тестов у него нет.
    gaps: ""
    required: true

  edge_cases:
    score: 90
    status: "complete"
    value: |
      Список подтверждён пользователем как полный:
      - Пауза нажата ДО первого тика, когда данных ещё нет: пауза встаёт, экран остаётся пустым
        до снятия (проще и честнее, чем игнорировать нажатие).
      - Ресайз терминала на паузе: раскладка пересчитывается, перерисовка идёт из последнего
        замороженного кадра — значит кадр надо ХРАНИТЬ, а не просто выбрасывать.
      - `v` (verbose) на паузе: то же самое — раскладка меняется, кадр тот же.
      - Автоскролл при пустом результате (все строки отфильтрованы): `ColsWidth` заполнены по
        заголовкам, окно считается, скролл работает.
      - Флаг автоскролла не должен пережить смену экрана — сбрасывается в обоих путях
        переключения, включая `switchViewToProcPidStat`.
      - Фильтр на колонке, отсутствующей в новой раскладке: фильтры хранятся per-view, поэтому
        проблемы нет, но индикатор берёт имена колонок из ТЕКУЩЕГО результата, а не из устаревшей копии.
      - Префикс длиннее ширины терминала: режется сам префикс с многоточием, иначе вытолкнет всё.
      - `config.view.Ncols` и `s.Result.Ncols` расходятся на один кадр после смены вьюхи
        (класс issue #99) — индексы клампятся против `s.Result.Ncols`.
    gaps: ""
    required: true

  error_scenarios:
    score: 88
    status: "complete"
    value: |
      - Отвал соединения / ошибка запроса во время паузы: кадр приходит с `stat.Stat.Error`,
