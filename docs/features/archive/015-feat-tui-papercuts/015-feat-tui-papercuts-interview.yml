      - Некорректный regexp в диалоге фильтра: поведение не меняется (`Filters: <err>`, фильтр
        не сохраняется), индикатор не появляется.
      - Сброс всех фильтров, когда фильтров нет: сообщение должно быть честным — существующий
        `setFilter` рапортует "regular expression cleared" даже когда ничего не удалил.
      - Терминал ниже порога verbose: height-guard откатывает раскладку в компакт и выдаёт
        подсказку; постоянные индикаторы обязаны пережить эту подсказку и наоборот.
      - Ошибка при записи в gocui-вьюху из рендера: существующие пути возврата ошибок не меняются.
    gaps: ""
    required: true

  verification_strategy:
    score: 88
    status: "complete"
    value: |
      Агент:
      - `make test` (с race-детектором) и `make lint` — обязательны.
      - Unit-тесты чистых функций: сдвиг окна к колонке сортировки, композиция строки cmdline,
        рендер шапки с интервалом, `topBandLayout` с новой арифметикой.
      - Тест дренажа паузы без gocui.
      - Починка геометрии диалога (пункт 7) НЕ полагается только на ручную проверку: расчёт
        позиции поля ввода выносится в чистую функцию (по прецеденту `firstTickHint`) и
        покрывается unit-тестом. `top/dialog.go` сегодня не имеет тестов вообще, поэтому правка
        непокрытого файла без собственного теста недопустима.
      - Прогоны на выделенном стенде по регламенту из `patterns.md`
        ("Driving the TUI on a remote test stand"): свежий бинарник заливается на стенд, tmux с
        фиксированной геометрией, `send-keys` для хоткеев, `capture-pane -p` для текста и
        `capture-pane -p -e` для проверки bold в verbose. Узкая геометрия (`-x 60`) — для
        автоскролла и height-guard.
      Пользователь:
      - Финальная визуальная проверка всех шести пунктов на своём терминале.
    gaps: ""
    required: true

  ui_ux_requirements:
    score: 92
    status: "complete"
    value: |
      - Пункт 4: интервал обновления идёт в первой строке шапки следом за датой и временем —
        `pgcenter: <дата время>, refresh: 1s, load average: ...`.
      - Пункты 1 и 3: постоянные индикаторы живут ЗАРЕЗЕРВИРОВАННЫМ ЛЕВЫМ ПРЕФИКСОМ в cmdline,
        а не в шапке sysstat. Cmdline остаётся лентой транзиентных сообщений, но префикс
        дорисовывается при каждом выводе и переживает тик обновления, переключение экрана и
        любое транзиентное сообщение: `[PAUSED][F:datname] Refresh: ok`.
      - Индикатор фильтра показывает ИМЯ КОЛОНКИ (`[F:datname]`), не количество и не regexp:
        имя колонки объясняет, почему строк мало, а regexp может быть длинным и съест строку.
      - Несколько фильтров: перечисляем ВСЕ имена — `[F:datname,usename]`. Более двух фильтров
        одновременно — редкость, счётчик вместо имён не нужен.
      - Порядок префиксов, когда активны оба: `[PAUSED][F:datname]` — пауза первой.
      - Узкий терминал: если префикс и сообщение не влезают, режем СООБЩЕНИЕ, префикс сохраняем
        целиком — индикатор важнее текста "Refresh: ok".
      - Пункт 5: убрать пустую строку между cmdline и таблицей в verbose. Причина — компакт
        связывает `dbstatY0 = cmdlineY1 - 1`, а verbose считает `dbstatY0 = tallest + 1`
        независимо от cmdline, из-за чего строка y=10 не принадлежит ни одной вьюхе. Починка:
        `dbstatY0 = tallest` (`top/layout.go:50`). Побочный эффект принят: порог height-guard
        опускается с 13 до 12 строк терминала — verbose станет доступен на строку раньше.
      - Пункт 6: значения verbose-секций обеих панелей оборачиваются в `\033[37;1m...\033[0m`
        по образцу базовых строк. Сентинелы `n/a` НЕ болдим — bold читается как "здесь есть
        настоящее число", деградированные поля должны отличаться визуально.
      - Пункт 7: геометрию диалога чиним по причине, а не прячем префикс — позиция поля ввода
        считается от реальной длины строки cmdline, а не от `len(prompt)`.
    gaps: ""
    required: true

  risks:
    score: 88
    status: "complete"
    value: |
      Список подтверждён пользователем как достаточный:
      - Гонка на флаге паузы (пишет горутина gocui, читает `doWork`). Снимается `atomic.Bool`
        и race-детектором в `make test`.
      - Регресс cmdline: 26 мест вызова `printCmdline`. Единая точка композиции может сломать
        существующие сообщения. Снижение: композиция внутри `printCmdline`, чтобы места вызова
        не трогать, плюс чистая функция сборки строки под unit-тесты.
      - Починка диалогов идёт по территории без тестов: для `top/ui.go`, `top/keybindings.go`,
        `top/dialog.go`, `top/help.go` тестов нет вообще. Снижение: выносить решения в чистые
        функции (прецедент `firstTickHint`) и проверять на стенде.
      - Bold в verbose ломает тесты рендера (`Test_renderSysstat_verbose*`, verbose-тесты
        `renderPgstat`). Их надо обновлять осознанно, а не подгонять под фактический вывод.
      - Смена `renderSysstat`/`renderPgstat` сигнатур задевает call sites в тестах — механические
        ошибки компиляции, но их надо пройти все.
      - Рост скоупа: было 4 пункта из роадмапа, стало 8. Риск размывания фичи. Снижение: общая
        рамка "фрикции интерфейса в пакете top/", единый набор критериев приёмки.
        Считаем честно (правка по замечанию dev-customer): сброс всех фильтров — это ОТДЕЛЬНЫЙ
        функциональный юнит, а не деталь пункта 3. Новый постоянный хоткей, новая строка в справке,
        новое поведение, которое пользователю надо освоить. Ранее он был спрятан внутри критериев
        приёмки индикатора фильтра, из-за чего сама фича недосчитывала свой рост.
      - Обоснование батчовки ("каждый пункт — горстка строк, отдельный SDD-цикл дороже кода")
        верно для исходных 4 пунктов и НЕ пересмотрено после роста до 8. Пауза одна тянет
        межгорутинную гонку, хранение замороженного кадра и обход для кадров с ошибкой; починка
        диалогов идёт по четырём файлам без единого теста. Принято сознательно: внешних дедлайнов
        нет. Но если на реализации выяснится, что пауза тянет на отдельный проход — дробить
        задним числом дешевле, чем тащить всё одним куском.
      - Системный риск, а не разовый: политика "чинить причину внутри фичи" тянет скоуп вверх
        в любой фиче такого типа. Держать в уме на будущих батчах.
    gaps: ""
    required: true

  technical_decisions:
    score: 60
    status: "partial"
    value: |
      Решено до интервью (не переоткрывать):
      - Пауза гейтит только рендер, коллектор продолжает работать; кадры дренируются и
        отбрасываются, чтобы не блокировать коллектор и не показать устаревший кадр на resume.
      - Автоскролл срабатывает только на смену `OrderKey` (стрелки ←/→). Ручной скролл `[`/`]`
        автоскролл не триггерит, поэтому окно остаётся там, куда его увёл пользователь.
      - Переключение вьюхи оставляет текущее поведение `scrollOffset = 0`
        (`top/config_view.go:243`); отдельная обработка дефолтного `OrderKey` четырёх вьюх
        (`replslots` 4, `stat_io` 4, `stat_io_time` 4, `statements_jit` 2) НЕ делается —
        на реальном терминале эти колонки видны, а первое же нажатие ←/→ подтянет окно.
      - Часы из пункта 4 исключены — они уже есть в `top/stat.go:272`.
      Решено в ходе интервью:
      - Пауза замораживает ВЕСЬ кадр (обе панели, таблица, боковые панели включая logtail):
        один тик = один целостный кадр; частичная заморозка смешала бы числа из разных моментов.
      - На паузе работают сортировка, скролл и фильтр (перерисовка из замороженного кадра);
        смена экрана СНИМАЕТ паузу (замороженного кадра для нового экрана нет); возврат из
        pager/editor паузу СОХРАНЯЕТ (флаг живёт на `config`, а не в локальной переменной `doWork`).
      - Кадры с ошибкой пробивают паузу.
      - Геометрия диалогов чинится по причине (позиция поля ввода от реальной длины строки),
        а не обходится сокрытием префикса.
      - Сброс всех фильтров — новый хоткей `\` (зеркало `/`): не занимает букву из дефицитного
        алфавита; `?` отвергнут, потому что пользователи ищут по нему справку.
      alternatives_considered:
        - decision: "Где живут постоянные индикаторы"
          chosen: "Зарезервированный левый префикс в cmdline"
          rejected: "Вынос в шапку sysstat — статистическая панель не место для состояния UI"
        - decision: "Что показывает индикатор фильтра"
          chosen: "Имена всех отфильтрованных колонок — `[F:datname,usename]`"
          rejected: "Только факт `[F]` — не объясняет; счётчик `[F:2]` — не говорит где; regexp — длинный, съест строку"
        - decision: "Диалоги и постоянный префикс"
          chosen: "Починить геометрию диалога"
          rejected: "Прятать префикс на время диалога — дёшево, но пауза и фильтр становятся невидимы ровно тогда, когда пользователь вводит новый фильтр"
        - decision: "Фильтр нельзя снять с другой колонки"
          chosen: "Починить: добавить сброс всех фильтров хоткеем `\\`"
          rejected: "Оставить и записать в техдолг — индикатор делает яму видимой, то есть ухудшает ситуацию вместо улучшения"
        - decision: "Хоткей сброса фильтров"
          chosen: "`\\`"
          rejected: "`?` — во многих TUI это справка, а у нас справка на `h`/`F1`; `e`/`g`/`u`/`y` — тратят дефицитную букву; `c`/`W`/`T`/`O` — зарезервированы роадмапом под [016]-[019]"
        - decision: "Автоскролл: только на смену OrderKey vs инвариант 'OrderKey всегда в окне' на каждом рендере"
          chosen: "Только на смену OrderKey (одноразовый флаг, отрабатываемый на следующем рендере)"
          rejected: "Инвариант на каждом рендере — откатывал бы ручной скролл `[`/`]` на следующем же тике, ломая фичу 009"
        - decision: "Пауза: гейт рендера vs остановка коллектора"
          chosen: "Гейт рендера с дренированием statCh"
          rejected: "Остановка коллектора — первый кадр после resume показал бы дельту за всё окно паузы в per-interval колонках (10 минут паузы при refresh=1s → число ~600x нормы)"
        - decision: "Обработка дефолтного OrderKey при входе во вьюху"
          chosen: "Не делать"
          rejected: "Делать — дефолтные OrderKey всего 4/4/4/2, эти колонки видны на любом вменяемом терминале; состояние самоисправляется первым нажатием стрелки"
    gaps: ""
    required: false

# ============================================================================
# Phase 3: Integration & Technical Context
# ============================================================================
phase3_integration:

  integration_points:
    score: 90
    status: "complete"
    value: |
      Уточнено по code research:
      - `top/config.go` — новые поля: флаг паузы (`atomic.Bool`), одноразовый флаг автоскролла,
        `refresh time.Duration`, последний кадр для перерисовки на паузе.
      - `top/ui.go` — ветка `case s := <-statCh:` в `doWork` (дренаж), `printCmdline` (композиция
        префикса), `layout()` (без изменений, кроме следствий из `topBandLayout`).
      - `top/keybindings.go` — `gocui.KeySpace` на вьюху `"sysstat"`; хоткей сброса всех фильтров.
      - `top/config_view.go` — `orderKeyLeft`/`orderKeyRight` ставят флаг автоскролла;
        `setFilter` и сброс всех фильтров; сброс флага в `viewSwitchHandler` и
        `switchViewToProcPidStat`.
      - `top/stat.go` — `renderDbstat` (применение автоскролла перед `visibleColumns`),
        `renderSysstat` (интервал), `renderSysstatVerbose` и `renderPgstatVerbose` (bold).
      - `top/layout.go` — `topBandLayout`: `dbstatY0 = tallest`.
      - `top/dialog.go` — геометрия поля ввода относительно реальной длины cmdline.
      - `top/help.go` — документирование новых хоткеев.
      Не затрагиваются: `internal/query`, `internal/view` (кроме чтения), `record`, `report`,
      `profile`. Новых view и колонок нет — count-based тесты не меняются.
    gaps: ""
    required: true

  dependencies:
    score: 88
    status: "complete"
    value: |
      Опирается на фичу 009 (горизонтальный скролл): `config.scrollOffset`, `visibleColumns`,
      io.Writer-принтеры. Пункты 2 и 3 существуют только из-за 009.
      Фича 014 (колоризация) отложена — зависимости от неё нет.
      Закрыто по code research:
      - `profile` не импортирует `top/` и имеет собственный путь рендера — взаимодействия нет.
      - `record`/`report` не затрагиваются: нет новых view, колонок и запросов.
      - verbose-режим (010) разобран отдельно: пункты 5 и 6 правят именно его, взаимодействие
        с паузой и с подсказкой height-guard зафиксировано в edge_cases и error_scenarios.
