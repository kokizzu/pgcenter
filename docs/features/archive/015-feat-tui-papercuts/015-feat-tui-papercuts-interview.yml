# ============================================================================
# Phase 4: Completion
# ============================================================================
phase4_completion:
  userspec_file: "docs/features/015-feat-tui-papercuts/015-feat-tui-papercuts.md"
  status: "approved"
  split_off: |
    Пауза обновления по `Space` вынесена в отдельную фичу после валидации (см. запись 5 в
    conversation_history). Материал для её будущего интервью, чтобы не переоткрывать:
    - Гейт рендера с дренированием небуферизованного `statCh`, коллектор не останавливается.
    - Флаг паузы — единственная межгорутинная гонка, нужен `atomic.Bool`; флаг живёт на `config`,
      а не в локальной переменной `doWork` (иначе теряется при пересоздании UI).
    - Замороженный кадр надо ХРАНИТЬ: ресайз терминала и переключение verbose на паузе
      пересчитывают раскладку и перерисовывают тот же кадр.
    - Смена сортировки на паузе СНИМАЕТ паузу (решено пользователем): сортировка выполняется в
      горутине сборщика, порядок строк нельзя пересчитать на рендере.
    - Смена экрана снимает паузу.
    - Возврат из pager/editor: интерфейс пересоздаётся целиком, буферы уничтожаются — либо
      перерисовывать из хранимого кадра, либо снимать паузу. РЕШЕНИЕ НЕ ПРИНЯТО, ранее
      выбранное "пауза сохраняется" даёт пустой экран без явной перерисовки.
    - Кадры с ошибкой пробивают паузу. ОГОВОРКА: техдолг [016] — часть ошибок сборщика глотается
      и приезжает пустым кадром, а не кадром с Error, так что гарантия слабее, чем звучит.
    - `Space` свободен; биндить `gocui.KeySpace` (не руну) и только на вьюху `"sysstat"`.
    - Композитор командной строки к тому моменту уже готов — добавляется токен `[PAUSED]` слева
      от `[F:...]`.
    - Ценность обоснована по аналогии с другими top-подобными инструментами, а не по жалобе;
      контраргумент, который стоит взвесить: `z` допускает интервал до 300 секунд, а pgcenter
      почти всегда живёт в tmux с copy-mode.

